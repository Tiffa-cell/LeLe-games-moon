    <path d="M 158,40 Q 158,45 163,45 Q 158,45 158,50 Q 158,45 153,45 Q 158,45 158,40 Z" opacity="0.8"/>
  </g>
  <circle cx="82" cy="72" r="66" fill="url(#glow)"/>
  <circle cx="82" cy="72" r="36" fill="#f4ecd8"/>
  <g fill="#e3d7bd" opacity="0.55">
