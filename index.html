<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="月相">
  <meta name="format-detection" content="telephone=no">
  <title>月相</title>
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <!-- theme.js 必须在 head 里同步加载：首帧之前就把颜色写进 CSS 变量，不会闪白 -->
  <script src="theme.js"></script>
</head>
<body>
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"
       role="img" aria-label="月相 · 第1章 圆缺循环：拖着小月亮绕一圈"></svg>
  <!-- 第2章的提词层（HTML）：上方三个进度点、下方一句给念的人的提词（一次只显示一句）、底边 8 相位小月相带 -->
  <div id="hud" hidden>
    <div id="progress" aria-label="进度"></div>
    <svg id="month-ring" xmlns="http://www.w3.org/2000/svg" aria-label="一个月：八颗星" role="img" hidden></svg>
    <svg id="target" xmlns="http://www.w3.org/2000/svg" aria-label="目标月相" role="img" hidden></svg>
    <div id="prompt" aria-live="polite"></div>
    <svg id="phase-strip" xmlns="http://www.w3.org/2000/svg" aria-label="八个相位" role="img"></svg>
  </div>
  <nav id="themes" aria-label="夜色"></nav>
  <!-- 章节入口：第1章过关后出现的太阳 + → / 第2章过关后的 ← + 小月亮（图标由 app.js 画） -->
  <button id="chapter-nav" type="button" aria-label="进入第2章"></button>

  <script src="js/params.js"></script>
  <script src="js/util.js"></script>
  <script src="js/moon.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/chapter1.js"></script>
  <script src="js/chapter2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
